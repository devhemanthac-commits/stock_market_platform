<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History — StockSim</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">📈 Stock<span>Sim</span></div>
        <ul class="sidebar-nav">
            <li><a href="dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a></li>
            <li><a href="markets.html"><span class="nav-icon">📊</span> Markets</a></li>
            <li><a href="trade.html"><span class="nav-icon">💹</span> Trade</a></li>
            <li><a href="portfolio.html"><span class="nav-icon">💼</span> Portfolio</a></li>
            <li><a href="history.html" class="active"><span class="nav-icon">📜</span> History</a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-details">
                    <div class="user-name" id="userName">User</div>
                    <div class="user-balance" id="userBalance">₹0.00</div>
                </div>
            </div>
            <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:10px;" onclick="logout()">Logout</button>
        </div>
    </aside>

    <div class="main-content">
        <div class="top-bar">
            <h1>Transaction History</h1>
        </div>

        <div class="page-content">
            <div class="data-card">
                <div class="data-card-header">
                    <h2>Executed Trades</h2>
                </div>
                <div id="historyContainer">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    async function loadHistory() {
        await loadUserInfo();
        try {
            const res = await fetch('api/history');
            const txns = await res.json();
            const container = document.getElementById('historyContainer');
            if (!txns || txns.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📜</div>
                        <p>No transactions yet. <a href="trade.html">Make your first trade!</a></p>
                    </div>`;
                return;
            }
            container.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date &amp; Time</th>
                            <th>Type</th>
                            <th>Stock</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Total</th>
                            <th>Order ID</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${txns.map(t => `
                            <tr>
                                <td>${t.timestamp}</td>
                                <td><span class="badge ${t.type === 'BUY' ? 'badge-buy' : 'badge-sell'}">${t.type}</span></td>
                                <td><strong>${t.symbol}</strong><br><span style="color:var(--text-muted);font-size:0.8rem;">${t.stockName}</span></td>
                                <td>${t.quantity}</td>
                                <td>₹${t.price.toFixed(2)}</td>
                                <td><strong>₹${t.total.toFixed(2)}</strong></td>
                                <td style="color:var(--text-muted);font-size:0.8rem;">${t.id}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        } catch(e) { console.error('Error loading history:', e); }
    }
    loadHistory();
</script>
</body>
</html>
